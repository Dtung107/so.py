name: Build Android APK (Pydroid 3 Web)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Pydroid 3 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22 (Required by Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java Development Kit (JDK 21 - Required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK (platform 36 + build-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: 📋 Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b816f454d0d" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # Ensure required packages are present
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: 📦 Install Node dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🏗️ Build Web Assets (Vite)
        run: |
          npm run build

      - name: 📱 Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: 🔑 Set gradlew execution permissions
        run: |
          chmod +x android/gradlew || true

      - name: 🔨 Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: 📋 Verify and Prepare APK Artifact
        run: |
          mkdir -p output-apk
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ ERROR: No APK was found in android/app/build/outputs/apk"
            find android/app/build -type f -name "*.apk" || true
            ls -laR android/app/build/outputs/ 2>/dev/null || true
            exit 1
          fi
          echo "✅ Found APK at: $APK_FILE"
          cp "$APK_FILE" output-apk/Pydroid3-Web.apk
          ls -lh output-apk/

      - name: 🚀 Upload APK Artifact (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Pydroid3-Web-Android-APK
          path: output-apk/Pydroid3-Web.apk
          retention-days: 30

      - name: 🏷️ Create Release with APK (Optional when tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/Pydroid3-Web.apk
          generate_release_notes: true
          draft: false
          prerelease: false
