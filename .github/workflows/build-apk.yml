name: Build Android APK (Pydroid 3 Web)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra các tệp bắt buộc có đủ không
        run: |
          missing=0
          for f in \
            android/app/src/main/res/values/styles.xml \
            android/app/src/main/res/values/strings.xml \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            android/app/src/main/res/layout/activity_main.xml \
            android/gradle/wrapper/gradle-wrapper.jar \
            public/pyodide/pyodide.asm.wasm \
            public/pyodide/pyodide.asm.js; do
            if [ ! -f "$f" ]; then echo "THIẾU TỆP: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "Đủ tệp bắt buộc"

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài thư viện web
        run: npm install --legacy-peer-deps

      - name: Build bản web
        run: npm run build

      - name: Đồng bộ sang Android
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Đổi tên APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "Không tìm thấy APK"; exit 1; fi
          cp "$APK" Pydroid3-Web.apk

      - name: Tải APK lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pydroid3-Web-Android-APK
          path: Pydroid3-Web.apk
          retention-days: 30
